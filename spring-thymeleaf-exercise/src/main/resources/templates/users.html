<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }
        .form-section h2,
        .list-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .delete-btn {
            background: #f44336;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }
        .delete-btn:hover {
            background: #d32f2f;
        }
        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ユーザー管理システム</h1>
            <p>Thymeleafを使用した登録・一覧表示</p>
        </div>

        <div class="content">
            <!-- 登録フォーム -->
            <div class="form-section">
                <h2>新規ユーザー登録</h2>
                
                <div th:if="${error}" className="error" th:text="${error}" >
                    エラーメッセージ
                </div>

                <form th:action="@{/add}" method="post">
                    <div class="form-group">
                        <label for="name">名前：</label>
                                         <input type="text" id="name" name="name" th:value="${userForm.name}" required placeholder="東北 太郎">
                    </div>

                    <div className="form-group">
                        <label htmlFor="email">メール：</label>
                        <input type="email" id="email" name="email" th:value="${userForm.email}" placeholder="taro@example.com">
                    </div>

                    <div className="form-group">
                        <label htmlFor="department">部門：</label>
                        <input type="text" id="department" name="department" th:value="${userForm.department}" placeholder="第1部門">
                    </div>

                    <button type="submit">登録</button>
                </form>
            </div>

            <!-- 一覧表示 -->
            <div class="list-section">
                <h2>登録済みユーザー一覧</h2>

                <div th:if="${users.isEmpty()}" className="empty-message">
                    登録されたユーザーがいません
                </div>

                <table th:unless="${users.isEmpty()}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>名前</th>
                            <th>メール</th>
                            <th>部門</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {/* th:eachを使用してループ処理 */}
                        <tr th:each="user : ${users}">
                                   <td th:text="${user.id}">1</td>
                            <td th:text="${user.name}">東北 太郎</td>
                            <td th:text="${user.email}">taro@example.com</td>
                            <td th:text="${user.department}">第1部門</td>
                            <td>
                                <a th:href="@{/delete/{id}(id=${user.id})}">
                                    <button type="button" className="delete-btn">削除</button>ss="delete-btn">削除</button>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
